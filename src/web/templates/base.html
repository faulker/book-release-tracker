<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}book-release-tracker{% endblock %}</title>
  <style>
    :root {
      color-scheme: light dark;
      /* Warm paper / ink palette; everything derives from these. */
      --paper: light-dark(oklch(0.965 0.012 85), oklch(0.22 0.012 60));
      --paper-raised: light-dark(oklch(0.985 0.008 90), oklch(0.26 0.014 60));
      --ink: light-dark(oklch(0.28 0.02 55), oklch(0.92 0.015 85));
      --ink-soft: light-dark(oklch(0.48 0.02 55), oklch(0.72 0.015 80));
      --rule: light-dark(oklch(0.86 0.02 80), oklch(0.34 0.015 60));
      --rule-strong: light-dark(oklch(0.55 0.03 60), oklch(0.6 0.02 70));
      --accent: light-dark(oklch(0.5 0.13 40), oklch(0.72 0.12 45));
      --ok: light-dark(oklch(0.5 0.12 150), oklch(0.75 0.13 150));
      --warn: light-dark(oklch(0.6 0.13 80), oklch(0.8 0.13 85));
      --bad: light-dark(oklch(0.5 0.16 25), oklch(0.7 0.16 25));
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .page { max-width: 64rem; margin: 0 auto; padding: clamp(1rem, 4vw, 2.5rem) clamp(1rem, 3vw, 2rem) 4rem; }

    header.masthead {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 1.6rem;
      border-bottom: 3px double var(--rule-strong);
      padding-bottom: 0.9rem; margin-bottom: 2rem;
    }
    .brand {
      font-family: var(--serif); font-style: italic; font-weight: 600;
      font-size: 1.35rem; color: var(--ink); text-decoration: none;
      margin-right: auto; letter-spacing: 0.01em;
    }
    nav { display: flex; gap: 1.2rem; align-items: baseline; }
    nav a {
      color: var(--ink-soft); text-decoration: none;
      font-size: 0.82rem; letter-spacing: 0.09em; text-transform: uppercase;
      padding-bottom: 0.15rem; border-bottom: 2px solid transparent;
    }
    nav a:hover { color: var(--accent); }
    nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

    h1 {
      font-family: var(--serif); font-weight: 600; font-size: clamp(1.6rem, 3.5vw, 2.1rem);
      line-height: 1.15; margin: 0 0 0.35rem;
    }
    .lede { color: var(--ink-soft); margin: 0 0 1.8rem; max-width: 46rem; }
    h2 {
      font-family: var(--serif); font-size: 1.15rem; font-weight: 600;
      margin: 2.4rem 0 0.8rem;
    }

    table { border-collapse: collapse; width: 100%; }
    th {
      text-align: left; font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft);
      padding: 0 0.7rem 0.45rem 0; border-bottom: 1px solid var(--rule-strong);
    }
    td {
      padding: 0.55rem 0.7rem 0.55rem 0;
      border-bottom: 1px solid var(--rule);
      vertical-align: baseline;
      font-variant-numeric: tabular-nums;
    }
    tr:hover > td { background: var(--paper-raised); }
    td.title-cell { font-family: var(--serif); font-size: 1.02rem; }
    td.muted, .muted { color: var(--ink-soft); }
    /* Dates like 2026-07-25 would otherwise wrap at the hyphens. */
    .date { white-space: nowrap; }
    td a {
      color: inherit; text-decoration: underline;
      text-decoration-color: var(--rule-strong); text-underline-offset: 2px;
    }
    td a:hover { color: var(--accent); text-decoration-color: var(--accent); }
    .table-scroll { overflow-x: auto; }

    .status { white-space: nowrap; font-size: 0.85rem; }
    .status::before { content: "●"; font-size: 0.6rem; vertical-align: 0.12em; margin-right: 0.35rem; }
    .status-ok::before, .status-matched::before { color: var(--ok); }
    .status-partial::before, .status-unmatched::before { color: var(--warn); }
    .status-failed::before { color: var(--bad); }
    .status-running::before, .status-overridden::before { color: var(--accent); }
    .status-ignored { color: var(--ink-soft); }
    .status-ignored::before { color: var(--rule-strong); }

    button {
      font: inherit; font-size: 0.83rem; letter-spacing: 0.02em;
      padding: 0.35rem 0.9rem; cursor: pointer; border-radius: 2px;
      border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    }
    button:hover { background: var(--accent); border-color: var(--accent); }
    button.ghost { background: transparent; color: var(--ink); }
    button.ghost:hover { background: transparent; color: var(--accent); border-color: var(--accent); }
    button.quiet {
      background: transparent; color: var(--ink-soft); border-color: var(--rule);
      padding: 0.2rem 0.6rem; font-size: 0.78rem;
    }
    button.quiet:hover { color: var(--bad); border-color: var(--bad); background: transparent; }

    input[type="text"], input[type="search"], input[type="number"] {
      font: inherit; font-size: 0.88rem; color: var(--ink);
      background: var(--paper-raised); border: 1px solid var(--rule);
      border-radius: 2px; padding: 0.35rem 0.6rem;
    }
    input[type="text"]:focus, input[type="search"]:focus, input[type="number"]:focus {
      outline: none; border-color: var(--accent);
    }
    input.days { width: 3.6rem; padding: 0.2rem 0.3rem; font-size: 0.8rem; }
    .filter-bar {
      margin: 0 0 1.1rem;
      display: flex; flex-wrap: wrap; gap: 0.5rem 1.4rem; align-items: center;
    }
    .filter-bar input[type="search"] { width: min(24rem, 100%); }
    .filter-bar label.toggle {
      font-size: 0.82rem; color: var(--ink-soft);
      display: flex; gap: 0.4rem; align-items: center; cursor: pointer;
    }

    .flash {
      border-left: 3px solid var(--warn);
      background: var(--paper-raised);
      padding: 0.6rem 0.9rem; margin: 0 0 1.4rem;
    }
    .empty {
      color: var(--ink-soft); font-style: italic; font-family: var(--serif);
      padding: 1.4rem 0;
    }
    form.inline { display: flex; flex-wrap: wrap; gap: 0.45rem; align-items: center; }
    form.inline label { font-size: 0.82rem; color: var(--ink-soft); white-space: nowrap; }

    .ledger {
      display: flex; flex-wrap: wrap; gap: 0 2.2rem;
      margin: 0 0 2rem; padding: 0.4rem 0 1.1rem;
      border-bottom: 1px solid var(--rule);
    }
    .ledger a { text-decoration: none; color: inherit; }
    .ledger .figure {
      font-family: var(--serif); font-size: 2rem; line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .ledger .label {
      font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-soft);
    }
    .ledger a:hover .figure { color: var(--accent); }

    .actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }

    dialog {
      background: var(--paper-raised); color: var(--ink);
      border: 1px solid var(--rule-strong); border-radius: 3px;
      padding: 1.2rem 1.4rem; max-width: 24rem;
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.4); }
    dialog h2 { margin: 0 0 0.9rem; }
    dialog .actions { margin-top: 1.1rem; }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="/">Book Release Tracker</a>
      <nav>
        <a href="/">Status</a>
        <a href="/series">Series</a>
        <a href="/upcoming">Upcoming</a>
        <a href="/new">New</a>
        <a href="/watchlist">Watchlist</a>
        <a href="/unmatched">Unmatched</a>
        <a href="/settings">Settings</a>
      </nav>
    </header>
    {% block content %}{% endblock %}
  </div>
  <script>
    // Underline the nav link for the page being viewed.
    for (const link of document.querySelectorAll("nav a")) {
      if (link.getAttribute("href") === location.pathname) {
        link.setAttribute("aria-current", "page");
      }
    }
    // Row visibility combines two inputs per table: the text filter
    // (input[data-filter]) and the hide-unscheduled toggle
    // (input[data-toggle-unscheduled]), so neither clobbers the other.
    function applyRowFilters(tableId) {
      const filter = document.querySelector(`input[data-filter="${tableId}"]`);
      const toggle = document.querySelector(`input[data-toggle-unscheduled="${tableId}"]`);
      const needle = filter ? filter.value.trim().toLowerCase() : "";
      const hideUnscheduled = toggle ? toggle.checked : false;
      for (const row of document.querySelectorAll(`#${tableId} tbody tr`)) {
        const matchesText = needle === "" || (row.dataset.search || "").toLowerCase().includes(needle);
        const unscheduled = row.dataset.scheduled === "0";
        row.hidden = !matchesText || (hideUnscheduled && unscheduled);
      }
    }
    for (const input of document.querySelectorAll("input[data-filter]")) {
      input.addEventListener("input", () => applyRowFilters(input.dataset.filter));
    }
    // The toggle's state survives reloads via localStorage.
    for (const toggle of document.querySelectorAll("input[data-toggle-unscheduled]")) {
      const key = `hide-unscheduled:${toggle.dataset.toggleUnscheduled}`;
      toggle.checked = localStorage.getItem(key) === "1";
      toggle.addEventListener("change", () => {
        localStorage.setItem(key, toggle.checked ? "1" : "0");
        applyRowFilters(toggle.dataset.toggleUnscheduled);
      });
      if (toggle.checked) applyRowFilters(toggle.dataset.toggleUnscheduled);
    }
  </script>
</body>
</html>
